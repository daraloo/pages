
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>پشت جلد</title>

<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Vazirmatn;
background:#ece8e4;
display:flex;
justify-content:center;
padding:40px;
}

.page{
width:210mm;
height:297mm;
background:#ffffff;
position:relative;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.18);
display:flex;
justify-content:center;
align-items:center;
}

.top-bar,
.bottom-bar{
position:absolute;
left:0;
width:100%;
height:14px;
background:linear-gradient(90deg,#8c5a2b,#d7a46c,#8c5a2b);
}

.top-bar{
top:0;
}

.bottom-bar{
bottom:0;
}

.page::after{
content:"";
position:absolute;
inset:0;
background:url("../file/images/logo.png") center center no-repeat;
background-size:520px;
opacity:.035;
pointer-events:none;
}

.content{
position:relative;
z-index:2;
text-align:center;
}

.logo{
width:190px;
margin-bottom:40px;
}

.title{
font-size:38px;
font-weight:700;
color:#7b4d21;
letter-spacing:.5px;
margin-bottom:12px;
}

.subtitle{
font-size:28px;
color:#a06a36;
margin-bottom:50px;
font-weight:500;
}

.line{
width:140px;
height:3px;
background:#b87333;
margin:0 auto 50px;
border-radius:5px;
}

.footer{
font-size:18px;
line-height:2.2;
color:#666;
}

.year{
margin-top:20px;
font-size:22px;
font-weight:bold;
letter-spacing:4px;
color:#8c5a2b;
}

@media print{

body{
padding:0;
background:#fff;
}

.page{
box-shadow:none;
}

@page{
size:A4;
margin:0;
}

}

</style>

</head>

<body>

<div class="page">

<div class="top-bar"></div>

<div class="content">

<img src="file/images/logo.png" class="logo">

<div class="title">

آیین‌نامه برگزاری مسابقات دوومیدانی

</div>

<div class="subtitle">

جام NICICO 1405

</div>

<div class="line"></div>

<div class="footer">

شرکت ملی صنایع مس ایران

<br>

واحد تربیت بدنی مجتمع مس درآلو

</div>

<div class="year">

1405

</div>

</div>

<div class="bottom-bar"></div>

</div>

</body>

</html>
